services:
  rag:
    build: .
    command: uvicorn erag.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EMBEDDER: ${EMBEDDER:-hash}
      OLLAMA_URL: http://ollama:11434
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
